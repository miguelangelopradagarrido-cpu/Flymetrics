<!DOCTYPE html>
<html lang="es">
<head>
      <script>
    window.API_BASE = (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://flymetrics-api.hostless.app';
    window.BASE_URL = window.API_BASE + '/api/v1';
  </script>
  <meta charset="UTF-8">
  <title>Autenticando con Google...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #003049;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(28, 130, 173, 0.2);
      border-top-color: #1C82AD;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p style="font-weight: 700; font-size: 0.95rem;">Verificando credenciales oficiales de Google...</p>
  <script>
    (function() {
      // 1. Extraer access_token del hash (#access_token=... o ?token=...)
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash || window.location.search);
      const token = params.get('access_token') || params.get('id_token') || params.get('token');
      const error = params.get('error');

      if (window.opener) {
        if (token) {
          window.opener.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', token: token }, '*');
        } else if (error) {
          window.opener.postMessage({ type: 'GOOGLE_AUTH_ERROR', error: error }, '*');
        }
        setTimeout(function() { window.close(); }, 350);
      } else {
        // Redirección alternativa en caso de no ser popup
        if (token) {
          sessionStorage.setItem('fm_google_direct_token', token);
          window.location.href = '/index.html';
        }
      }
    })();
  </script>
</body>
</html>
